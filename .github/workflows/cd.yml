name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest

    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.ADMIN_PAT }}

      - name: Download Changed Services
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: changed-services
          path: changed

      - name: Check Changed Services
        id: changed
        shell: bash
        run: |
          if [ ! -d changed ]; then
            echo "deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -Rq "true" changed; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changed.outputs.deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Image Tags
        id: update_tags
        if: steps.changed.outputs.deploy == 'true'
        shell: bash
        run: |
          BASE_RUN=4
          BASE_MINOR=4
          OFFSET=$(( ${{ github.event.workflow_run.run_number }} - BASE_RUN ))
          MINOR=$(( OFFSET / 10 + BASE_MINOR ))
          PATCH=$(( OFFSET % 10 ))
          VERSION="v1.${MINOR}.${PATCH}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$(cat changed/backend)" = "true" ]; then
            sed -i "s|image: krishanand01/evalio-backend:.*|image: krishanand01/evalio-backend:$VERSION|g" ops/deployment.yml
          fi

          if [ "$(cat changed/frontend)" = "true" ]; then
            sed -i "s|image: krishanand01/evalio-frontend:.*|image: krishanand01/evalio-frontend:$VERSION|g" ops/deployment.yml
          fi

      - name: Check For Manifest Changes
        id: gitcheck
        if: steps.changed.outputs.deploy == 'true'
        shell: bash
        run: |
          if git diff --quiet ops/deployment.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Changes
        if: |
          steps.changed.outputs.deploy == 'true' &&
          steps.gitcheck.outputs.changed == 'true'
        run: |
          git add ops/deployment.yml
          git commit -m "cd(deploy): update container images to v${{ steps.update_tags.outputs.version }}"

      - name: Create Automation Branch
        id: branch
        if: |
          steps.changed.outputs.deploy == 'true' &&
          steps.gitcheck.outputs.changed == 'true'
        shell: bash
        run: |
          BRANCH="automation/update-${{ steps.update_tags.outputs.version }}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push Branch
        if: |
          steps.changed.outputs.deploy == 'true' &&
          steps.gitcheck.outputs.changed == 'true'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create Pull Request
        if: |
          steps.changed.outputs.deploy == 'true' &&
          steps.gitcheck.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh pr create \
            --title "cd(deploy): update container images to v${{ steps.update_tags.outputs.version }}" \
            --body "Automated PR to update container image tags in deployment manifests.

## Changes
- Bumps backend image tags to the latest build
- Bumps frontend image tags to the latest build

Auto-merge is enabled — this PR will merge automatically." \
            --base main \
            --head "${{ steps.branch.outputs.branch }}"

      - name: Enable Auto Merge
        if: |
          steps.changed.outputs.deploy == 'true' &&
          steps.gitcheck.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh pr merge \
            --auto \
            --merge \
            --subject "cd(deploy): update container images to v${{ steps.update_tags.outputs.version }}"